name: Build CitriOS

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build CitriOS iOS
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew update
          brew install cmake ninja ccache

      - name: Configure
        run: |
          mkdir -p build/ios
          cd build/ios

          cmake ../.. \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO

      - name: Build CitriOS
        run: |
          xcodebuild \
            -project build/ios/citra.xcodeproj \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Add CitriOS icon
        run: |
          APP=$(find build/ios -name "*.app" -type d | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERRO: CitriOS.app não encontrado!"
            exit 1
          fi

          echo "App encontrado:"
          echo "$APP"

          if [ ! -f "citrios/dist/icon.icns" ]; then
            echo "ERRO: citrios/dist/icon.icns não encontrado!"
            exit 1
          fi

          cp "citrios/dist/icon.icns" "$APP/icon.icns"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIconFile string icon.icns" \
            "$APP/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleIconFile icon.icns" \
            "$APP/Info.plist"

      - name: Package CitriOS
        run: |
          APP=$(find build/ios -name "*.app" -type d | head -n 1)

          mkdir -p artifact
          cp -R "$APP" artifact/CitriOS.app

      - name: Upload CitriOS
        uses: actions/upload-artifact@v4
        with:
          name: CitriOS-iOS-arm64
          path: artifact/CitriOS.app
          if-no-files-found: error
