name: CitriOS Build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS arm64
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version

      - name: Install dependencies
        run: |
          brew update
          brew install cmake ninja ccache

      - name: Show environment
        run: |
          xcodebuild -showsdks
          cmake --version
          ninja --version

      - name: Configure iOS
        env:
          DEVELOPMENT_TEAM_ID: ""
          BUNDLE_IDENTIFIER: "com.berna.citrios"
          CITRA_IOS_NAME_SUFFIX: ""
          CITRA_IOS_SHORT_VERSION: "1.0.0"
          MOLTENVK_IOS_ARTIFACT: ""
        run: |
          mkdir -p build/ios
          cd build/ios

          cmake ../.. \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            -DENABLE_SDL2=OFF \
            -DENABLE_QT=OFF \
            -DDISABLE_LIBUSB=ON \
            -DENABLE_CUBEB=NO \
            -DENABLE_WEB_SERVICE=NO \
            -DZSTD_BUILD_PROGRAMS=NO \
            -DENABLE_FFMPEG_AUDIO_DECODER=OFF \
            -DENABLE_FFMPEG_VIDEO_DUMPER=OFF \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_IDENTIFIER}"

      - name: Build
        run: |
          xcodebuild \
            -project build/ios/citra.xcodeproj \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Find application
        run: |
          find build/ios -name "*.app" -type d

      - name: Upload CitriOS
        uses: actions/upload-artifact@v4
        with:
          name: CitriOS-iOS-arm64
          path: |
            build/ios/**/*.app
          if-no-files-found: error
